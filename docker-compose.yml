# Base de datos PostgreSQL para desarrollo.
# Las credenciales se toman del archivo .env (ver .env.example).
# Se publica en el puerto 5433 para no chocar con un PostgreSQL
# instalado localmente en Windows, que usa el 5432.
services:
  db:
    image: postgres:16
    container_name: reservas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - reservas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reservas-data:
